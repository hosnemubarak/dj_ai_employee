<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Something went wrong{% endblock %} | Order Desk</title>
    <style>
        :root {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f3f6fb;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at 15% 15%, #e0eaff, transparent 38%), #f3f6fb;
        }
        .error-card {
            width: min(100%, 560px);
            padding: 48px;
            border: 1px solid #e6eaf1;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 24px 70px rgb(34 54 88 / 10%);
            text-align: center;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 36px;
            color: #263c70;
            font-size: 13px;
            font-weight: 750;
            letter-spacing: .06em;
            text-transform: uppercase;
        }
        .brand-mark {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border-radius: 10px;
            color: #fff;
            background: #405fba;
            font-size: 17px;
        }
        .code {
            margin: 0;
            color: #405fba;
            font-size: 14px;
            font-weight: 750;
            letter-spacing: .12em;
        }
        h1 { margin: 12px 0; font-size: clamp(26px, 5vw, 36px); letter-spacing: -.04em; }
        .message { margin: 0 auto; max-width: 410px; color: #68748a; line-height: 1.7; }
        .actions { display: flex; justify-content: center; gap: 12px; margin-top: 30px; }
        .button {
            display: inline-block;
            padding: 11px 16px;
            border: 1px solid #dce2ec;
            border-radius: 9px;
            color: #34425e;
            background: #fff;
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
        }
        .button-primary { border-color: #405fba; color: #fff; background: #405fba; }
        .button:hover { filter: brightness(.96); }
        @media (max-width: 480px) {
            .error-card { padding: 36px 24px; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="error-card">
        <div class="brand"><span class="brand-mark" aria-hidden="true">O</span> Order Desk</div>
        <p class="code">{% block code %}ERROR{% endblock %}</p>
        <h1>{% block heading %}Something went wrong{% endblock %}</h1>
        <p class="message">{% block message %}We could not complete your request. Please try again.{% endblock %}</p>
        <div class="actions">
            <a class="button button-primary" href="/orders/">Go to orders</a>
            <a class="button" href="/">Return to home</a>
        </div>
    </main>
</body>
</html>
